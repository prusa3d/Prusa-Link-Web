<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#000000" />
    <!-- The printer serves its own favicon.ico beside the page; linking it
         costs the page nothing. public/favicon.ico is the same file, for the
         dev server only. -->
    <link rel="icon" href="favicon.ico" />
    <!-- Added to a phone's Home Screen, it opens full screen. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="PrusaLink" />
    <title>PrusaLink</title>
    <!-- The theme before the first paint (src/lib/theme). -->
    <script>
      try {
        var m = localStorage.getItem('prusalink.theme');
        if (
          m === 'dark' ||
          (m !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        )
          document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
